<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Block Rush</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game {
      width: 100%;
      max-width: 430px;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .score {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .board {
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      background: #222;
      padding: 4px;
      border-radius: 12px;
    }

    .cell {
      background: #333;
      border-radius: 5px;
    }

    .cell.filled {
      background: #D4AF37;
    }

    .pieces {
      margin-top: 25px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      min-height: 100px;
    }

    .piece {
      display: grid;
      gap: 3px;
      cursor: pointer;
    }

    .piece-cell {
      width: 22px;
      height: 22px;
      background: #D4AF37;
      border-radius: 4px;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #D4AF37;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="game">

    <h1>Block Rush</h1>

    <div class="score">
      Очки: <span id="score">0</span>
    </div>

    <div class="board" id="board"></div>

    <div class="pieces" id="pieces"></div>

    <button onclick="newGame()">Новая игра</button>

  </div>

  <script>
    const board = document.getElementById("board");
    const scoreElement = document.getElementById("score");

    let score = 0;

    function createBoard() {
      board.innerHTML = "";

      for (let i = 0; i < 64; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        board.appendChild(cell);
      }
    }

    function newGame() {
      score = 0;
      scoreElement.textContent = score;
      createBoard();
    }

    newGame();
  </script>

</body>
</html>
