<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Block Rush</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .game {
      width: 100%;
      max-width: 430px;
      padding: 18px;
      text-align: center;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 32px;
      font-weight: 800;
    }

    .score {
      font-size: 20px;
      margin-bottom: 18px;
      font-weight: bold;
    }

    .board {
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      background: #222;
      padding: 5px;
      border-radius: 14px;
      touch-action: none;
      position: relative;
    }

    .cell {
      background: #333;
      border-radius: 5px;
      transition: 0.12s;
    }

    .cell.filled {
      background: #D4AF37;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.18);
    }

    .cell.preview {
      background: rgba(212, 175, 55, 0.45);
    }

    .cell.invalid {
      background: rgba(255, 60, 60, 0.5);
    }

    .pieces {
      margin-top: 22px;
      min-height: 105px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 12px;
    }

    .piece {
      display: grid;
      gap: 3px;
      padding: 10px;
      min-width: 70px;
      min-height: 70px;
      justify-content: center;
      align-content: center;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: transform 0.15s, opacity 0.15s;
    }

    .piece:active {
      cursor: grabbing;
      transform: scale(1.08);
    }

    .piece-cell {
      width: 23px;
      height: 23px;
      background: #D4AF37;
      border-radius: 5px;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.18);
    }

    .piece-empty {
      width: 23px;
      height: 23px;
    }

    .piece.used {
      opacity: 0;
      pointer-events: none;
    }

    button {
      margin-top: 12px;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #D4AF37;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.96);
    }

    .message {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .message-box {
      width: 100%;
      max-width: 330px;
      background: #222;
      border-radius: 18px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .message-box h2 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .message-box p {
      margin: 0 0 20px;
      font-size: 19px;
    }

    .message-box button {
      margin: 0;
    }

    .drag-piece {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      opacity: 0.9;
      display: grid;
      gap: 3px;
      transform: translate(-50%, -120%);
    }

    @media (max-width: 360px) {
      .piece-cell,
      .piece-empty {
        width: 19px;
        height: 19px;
      }

      .piece {
        min-width: 60px;
        min-height: 60px;
        padding: 6px;
      }

      .game {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="game">

    <h1>Block Rush</h1>

    <div class="score">
      Очки: <span id="score">0</span>
    </div>

    <div class="board" id="board"></div>

    <div class="pieces" id="pieces"></div>

    <button onclick="newGame()">Новая игра</button>

  </div>

  <div class="message" id="gameOver">
    <div class="message-box">
      <h2>Игра окончена!</h2>

      <p>
        Твой счёт:
        <strong id="finalScore">0</strong>
      </p>

      <button onclick="newGame()">Играть снова</button>
    </div>
  </div>

<script>

  const board = document.getElementById("board");
  const piecesElement = document.getElementById("pieces");
  const scoreElement = document.getElementById("score");
  const gameOverElement = document.getElementById("gameOver");
  const finalScoreElement = document.getElementById("finalScore");

  const SIZE = 8;

  let score = 0;

  let boardState = [];

  let currentPieces = [];

  let dragging = false;

  let draggedPieceIndex = null;

  let dragPreview = null;


  /*
   * ФИГУРЫ
   */

  const shapes = [

    // 1
    [
      [1]
    ],

    // 2
    [
      [1, 1]
    ],

    // 3
    [
      [1, 1, 1]
    ],

    // 4
    [
      [1, 1, 1, 1]
    ],

    // 5
    [
      [1, 1, 1, 1, 1]
    ],

    // 6
    [
      [1],
      [1]
    ],

    // 7
    [
      [1],
      [1],
      [1]
    ],

    // 8
    [
      [1],
      [1],
      [1],
      [1]
    ],

    // 9
    [
      [1],
      [1],
      [1],
      [1],
      [1]
    ],

    // 10
    [
      [1, 1],
      [1, 1]
    ],

    // 11
    [
      [1, 1, 1],
      [1, 1, 1]
    ],

    // 12
    [
      [1, 1],
      [1, 1],
      [1, 1]
    ],

    // 13
    [
      [1, 1, 1],
      [1, 1, 1],
      [1, 1, 1]
    ],

    // 14
    [
      [1, 1, 1],
      [0, 1, 0]
    ],

    // 15
    [
      [0, 1, 0],
      [1, 1, 1]
    ],

    // 16
    [
      [1, 0],
      [1, 1]
    ],

    // 17
    [
      [0, 1],
      [1, 1]
    ],

    // 18
    [
      [1, 1],
      [1, 0]
    ],

    // 19
    [
      [1, 1],
      [0, 1]
    ],

    // 20
    [
      [1, 0, 0],
      [1, 1, 1]
    ],

    // 21
    [
      [0, 0, 1],
      [1, 1, 1]
    ],

    // 22
    [
      [1, 1, 1],
      [1, 0, 0]
    ],

    // 23
    [
      [1, 1, 1],
      [0, 0, 1]
    ],

    // 24
    [
      [1, 1, 0],
      [0, 1, 1]
    ],

    // 25
    [
      [0, 1, 1],
      [1, 1, 0]
    ],

    // 26
    [
      [1, 0],
      [1, 1],
      [0, 1]
    ],

    // 27
    [
      [0, 1],
      [1, 1],
      [1, 0]
    ],

    // 28
    [
      [1, 1, 1],
      [0, 1, 1]
    ],

    // 29
    [
      [1, 1, 1],
      [1, 1, 0]
    ],

    // 30
    [
      [1, 1, 0],
      [1, 1, 1]
    ]

  ];


  /*
   * НОВОЕ ПОЛЕ
   */

  function emptyBoard() {

    return Array.from(
      { length: SIZE },
      () => Array(SIZE).fill(0)
    );

  }


  /*
   * СОЗДАНИЕ ПОЛЯ
   */

  function createBoard() {

    board.innerHTML = "";

    for (let row = 0; row < SIZE; row++) {

      for (let col = 0; col < SIZE; col++) {

        const cell = document.createElement("div");

        cell.className = "cell";

        cell.dataset.row = row;
        cell.dataset.col = col;

        if (boardState[row][col]) {

          cell.classList.add("filled");

        }

        board.appendChild(cell);

      }

    }

  }


  /*
   * СЛУЧАЙНАЯ ФИГУРА
   */

  function randomShape() {

    const index =
      Math.floor(Math.random() * shapes.length);

    return shapes[index];

  }


  /*
   * СОЗДАНИЕ 3 ФИГУР
   */

  function createPieces() {

    piecesElement.innerHTML = "";

    currentPieces = [];

    for (let i = 0; i < 3; i++) {

      const shape = randomShape();

      currentPieces.push({
        shape: shape,
        used: false
      });

      createPieceElement(shape, i);

    }

  }


  /*
   * СОЗДАНИЕ ФИГУРЫ
   */

  function createPieceElement(shape, index) {

    const piece = document.createElement("div");

    piece.className = "piece";

    piece.dataset.index = index;

    piece.style.gridTemplateColumns =
      `repeat(${shape[0].length}, 23px)`;


    for (let row = 0; row < shape.length; row++) {

      for (
        let col = 0;
        col < shape[row].length;
        col++
      ) {

        const cell = document.createElement("div");

        if (shape[row][col] === 1) {

          cell.className = "piece-cell";

        } else {

          cell.className = "piece-empty";

        }

        piece.appendChild(cell);

      }

    }


    /*
     * КОМПЬЮТЕР
     */

    piece.draggable = true;

    piece.addEventListener(
      "dragstart",
      function(event) {

        if (currentPieces[index].used) {
          return;
        }

        draggedPieceIndex = index;

        event.dataTransfer.setData(
          "text/plain",
          index
        );

      }
    );


    /*
     * ТЕЛЕФОН
     */

    piece.addEventListener(
      "pointerdown",
      function(event) {

        if (currentPieces[index].used) {
          return;
        }

        startDragging(event, index);

      }
    );


    piecesElement.appendChild(piece);

  }


  /*
   * ПРОВЕРКА МОЖНО ЛИ ПОСТАВИТЬ
   */

  function canPlace(shape, row, col) {

    for (let r = 0; r < shape.length; r++) {

      for (let c = 0; c < shape[r].length; c++) {

        if (shape[r][c] !== 1) {
          continue;
        }

        const newRow = row + r;

        const newCol = col + c;

        if (
          newRow < 0 ||
          newRow >= SIZE ||
          newCol < 0 ||
          newCol >= SIZE
        ) {

          return false;

        }

        if (boardState[newRow][newCol]) {

          return false;

        }

      }

    }

    return true;

  }


  /*
   * ПОСТАВИТЬ ФИГУРУ
   */

  function placeShape(
    shape,
    row,
    col,
    pieceIndex
  ) {

    if (
      !canPlace(
        shape,
        row,
        col
      )
    ) {

      return false;

    }


    for (let r = 0; r < shape.length; r++) {

      for (let c = 0; c < shape[r].length; c++) {

        if (shape[r][c] === 1) {

          boardState[row + r][col + c] = 1;

        }

      }

    }


    currentPieces[pieceIndex].used = true;


    score +=
      shape.flat().filter(
        value => value === 1
      ).length;


    createBoard();

    clearLines();

    scoreElement.textContent = score;


    const piece =
      piecesElement.children[pieceIndex];

    if (piece) {

      piece.classList.add("used");

    }


    /*
     * Если использованы все 3 —
     * выдаём новые
     */

    if (
      currentPieces.every(
        piece => piece.used
      )
    ) {

      createPieces();

    }


    checkGameOver();

    return true;

  }


  /*
   * ОЧИСТКА ЛИНИЙ
   */

  function clearLines() {

    let rows = [];

    let cols = [];


    /*
     * Строки
     */

    for (let row = 0; row < SIZE; row++) {

      if (
        boardState[row].every(
          cell => cell === 1
        )
      ) {

        rows.push(row);

      }

    }


    /*
     * Столбцы
     */

    for (let col = 0; col < SIZE; col++) {

      let full = true;

      for (let row = 0; row < SIZE; row++) {

        if (!boardState[row][col]) {

          full = false;

          break;

        }

      }

      if (full) {

        cols.push(col);

      }

    }


    /*
     * Удаляем строки
     */

    rows.forEach(row => {

      for (let col = 0; col < SIZE; col++) {

        boardState[row][col] = 0;

      }

    });


    /*
     * Удаляем столбцы
     */

    cols.forEach(col => {

      for (let row = 0; row < SIZE; row++) {

        boardState[row][col] = 0;

      }

    });


    const total =
      rows.length + cols.length;


    if (total > 0) {

      score += total * 10;

      scoreElement.textContent = score;

      createBoard();

    }

  }


  /*
   * ПЕРЕТАСКИВАНИЕ НА ПК
   */

  board.addEventListener(
    "dragover",
    function(event) {

      event.preventDefault();

    }
  );


  board.addEventListener(
    "drop",
    function(event) {

      event.preventDefault();

      const index =
        Number(
          event.dataTransfer.getData(
            "text/plain"
          )
        );

      if (
        !currentPieces[index] ||
        currentPieces[index].used
      ) {

        return;

      }


      const position =
        getBoardPosition(
          event.clientX,
          event.clientY
        );


      placeShape(
        currentPieces[index].shape,
        position.row,
        position.col,
        index
      );

    }
  );


  /*
   * ПОЛУЧИТЬ КЛЕТКУ ПОЛЯ
   */

  function getBoardPosition(x, y) {

    const rect =
      board.getBoundingClientRect();

    const cellSize =
      rect.width / SIZE;


    let col =
      Math.floor(
        (x - rect.left) /
        cellSize
      );


    let row =
      Math.floor(
        (y - rect.top) /
        cellSize
      );


    col = Math.max(
      0,
      Math.min(SIZE - 1, col)
    );

    row = Math.max(
      0,
      Math.min(SIZE - 1, row)
    );


    return {
      row: row,
      col: col
    };

  }


  /*
   * ПЕРЕТАСКИВАНИЕ НА ТЕЛЕФОНЕ
   */

  function startDragging(event, index) {

    event.preventDefault();

    dragging = true;

    draggedPieceIndex = index;


    const shape =
      currentPieces[index].shape;


    createDragPiece(shape);

    moveDragPiece(
      event.clientX,
      event.clientY
    );


    window.addEventListener(
      "pointermove",
      onPointerMove
    );


    window.addEventListener(
      "pointerup",
      stopDragging,
      { once: true }
    );

  }


  function onPointerMove(event) {

    if (!dragging) {
      return;
    }

    moveDragPiece(
      event.clientX,
      event.clientY
    );

  }


  function moveDragPiece(x, y) {

    if (!dragPreview) {
      return;
    }

    dragPreview.style.left =
      x + "px";

    dragPreview.style.top =
      y + "px";


    const rect =
      board.getBoundingClientRect();


    if (
      x >= rect.left &&
      x <= rect.right &&
      y >= rect.top &&
      y <= rect.bottom
    ) {

      const position =
        getBoardPosition(x, y);


      showPreview(
        currentPieces[draggedPieceIndex].shape,
        position.row,
        position.col
      );

    } else {

      clearPreview();

    }

  }


  function stopDragging(event) {

    if (!dragging) {
      return;
    }


    const x =
      event.clientX;

    const y =
      event.clientY;


    const rect =
      board.getBoundingClientRect();


    if (
      x >= rect.left &&
      x <= rect.right &&
      y >= rect.top &&
      y <= rect.bottom
    ) {

      const position =
        getBoardPosition(x, y);


      placeShape(
        currentPieces[draggedPieceIndex].shape,
        position.row,
        position.col,
        draggedPieceIndex
      );

    }


    clearPreview();

    removeDragPiece();


    dragging = false;

    draggedPieceIndex = null;


    window.removeEventListener(
      "pointermove",
      onPointerMove
    );

  }


  /*
   * ПРЕДВАРИТЕЛЬНЫЙ ПРОСМОТР
   */

  function showPreview(shape, row, col) {

    clearPreview();


    const valid =
      canPlace(
        shape,
        row,
        col
      );


    for (let r = 0; r < shape.length; r++) {

      for (let c = 0; c < shape[r].length; c++) {

        if (shape[r][c] !== 1) {
          continue;
        }


        const targetRow =
          row + r;

        const targetCol =
          col + c;


        if (
          targetRow < 0 ||
          targetRow >= SIZE ||
          targetCol < 0 ||
          targetCol >= SIZE
        ) {

          continue;

        }


        const cell =
          board.querySelector(
            `[data-row="${targetRow}"][data-col="${targetCol}"]`
          );


        if (cell) {

          if (valid) {

            cell.classList.add(
              "preview"
            );

          } else {

            cell.classList.add(
              "invalid"
            );

          }

        }

      }

    }

  }


  function clearPreview() {

    board
      .querySelectorAll(
        ".preview, .invalid"
      )
      .forEach(cell => {

        cell.classList.remove(
          "preview",
          "invalid"
        );

      });

  }


  /*
   * ВИЗУАЛЬНАЯ ФИГУРА ПРИ ПЕРЕТАСКИВАНИИ
   */

  function createDragPiece(shape) {

    removeDragPiece();


    dragPreview =
      document.createElement("div");

    dragPreview.className =
      "drag-piece";


    dragPreview.style.gridTemplateColumns =
      `repeat(${shape[0].length}, 23px)`;


    shape.forEach(row => {

      row.forEach(value => {

        const cell =
          document.createElement("div");


        if (value === 1) {

          cell.className =
            "piece-cell";

        } else {

          cell.className =
            "piece-empty";

        }


        dragPreview.appendChild(cell);

      });

    });


    document.body.appendChild(
      dragPreview
    );

  }


  function removeDragPiece() {

    if (dragPreview) {

      dragPreview.remove();

      dragPreview = null;

    }

  }


  /*
   * ПРОВЕРКА GAME OVER
   */

  function checkGameOver() {

    const available =
      currentPieces.filter(
        piece => !piece.used
      );


    if (available.length === 0) {

      return;

    }


    for (const piece of available) {

      const shape =
        piece.shape;


      for (let row = 0; row < SIZE; row++) {

        for (let col = 0; col < SIZE; col++) {

          if (
            canPlace(
              shape,
              row,
              col
            )
          ) {

            return;

          }

        }

      }

    }


    finalScoreElement.textContent =
      score;

    gameOverElement.style.display =
      "flex";

  }


  /*
   * НОВАЯ ИГРА
   */

  function newGame() {

    score = 0;

    boardState =
      emptyBoard();

    currentPieces = [];

    draggedPieceIndex = null;

    dragging = false;


    scoreElement.textContent =
      "0";


    gameOverElement.style.display =
      "none";


    clearPreview();

    removeDragPiece();


    createBoard();

    createPieces();

  }


  /*
   * СТАРТ
   */

  newGame();

</script>

</body>
</html>
